name: PlatformHub build and security tests

on:
  push:
    branches:
      - master
      - feature/first-platform-admin-bootstrap
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore PlatformHub.sln

      - name: Build solution
        run: dotnet build PlatformHub.sln --configuration Release --no-restore

      - name: Restore security test project
        run: dotnet restore tests/PlatformHub.SecurityTests/PlatformHub.SecurityTests.csproj

      - name: Run security tests
        run: dotnet test tests/PlatformHub.SecurityTests/PlatformHub.SecurityTests.csproj --configuration Release --no-restore
